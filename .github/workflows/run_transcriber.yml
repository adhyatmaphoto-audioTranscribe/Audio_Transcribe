name: Automated Audio Transcriber

on:
  schedule:
    - cron: '26 11 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-transcription:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true # <-- CRITICAL: Gives the runner authority to push code changes back

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install System Dependencies
      run: |
        pip install google-genai google-api-python-client google-auth mutagen python-dotenv requests

    - name: Execute Transcriber Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      run: python -u cloud_audio_transcriber.py

    - name: Commit and Push Transcripts back to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Explicitly stage your tracked folder 
        git add transcripts/
        
        # Safe check using porcelain status to see if files actually changed
        if [ -n "$(git status --porcelain transcripts/)" ]; then
          git commit -m "🤖 Automated sync: Added new transcripts [skip ci]"
          # <-- CRITICAL: Forces git to push directly to the running branch (e.g., main)
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "ℹ️ No new transcripts found to commit today."
        fi
