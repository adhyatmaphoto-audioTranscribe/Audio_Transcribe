name: Automated Audio Transcriber

on:
  schedule:
    - cron: '26 11 * * *' 
  workflow_dispatch: 

# Concurrency handling stops double executions if queues stack up
concurrency:
  group: audio-transcriber
  cancel-in-progress: false

jobs:
  run-transcription:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Protects your minutes allowance from infinite runtime freezes
    permissions:
      contents: write # Restricted strictly to job level scope for safety profiles

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip' # Explicitly caches parsed environments to accelerate daily startup

    - name: Install System Dependencies
      run: |
        pip install -r requirements.txt

    - name: Execute Transcriber Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      run: python -u cloud_audio_transcriber.py

    - name: Commit and Push Transcripts back to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add transcripts/
        
        # Cleaner, explicit cached tracking optimization
        if ! git diff --cached --quiet; then
          git commit -m "🤖 Automated sync: Added new transcripts [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "ℹ️ No new transcripts found to commit today."
        fi
