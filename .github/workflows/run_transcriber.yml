name: Automated Audio Transcriber

on:
  schedule:
    - cron: '0 11 * * *' # Triggers automatically every single day at 3:30 PM IST (10:00 AM UTC)
  workflow_dispatch: # Allows you to press the manual button to run it instantly

jobs:
  run-transcription:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install System Dependencies
      run: |
        pip install google-genai google-api-python-client google-auth

    - name: Recreate Drive Token File
      run: echo '${{ secrets.DRIVE_TOKEN }}' > token.json

    - name: Execute Transcriber Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python split_pdf_cloud_script.py
